# -- general --------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0        # no delay after Esc (matters: nvim maps Esc to save)
set -g focus-events on       # let apps (nvim) see focus in/out for autoread
set -g base-index 1          # windows start at 1, easier to reach than 0
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # true color

# -- keys -------------------------------------------------------------------
setw -g mode-keys vi

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# vim-style pane selection (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# quick pane switching without prefix (alt+hjkl), mirrors nvim window nav
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# splits that keep the current pane's working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# -- theme: rose-pine moon, to match nvim/wezterm --------------------------
# https://rosepinetheme.com/palette (moon variant)
# base #232136  surface #2a273f  text #e0def4  muted #6e6a86
# gold #f6c177  foam #9ccfd8    iris #c4a7e7

set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left-length 40
set -g status-left "#[bg=#c4a7e7,fg=#232136,bold] #S #[bg=#232136,fg=#c4a7e7]"
set -g status-right "#[fg=#6e6a86]%Y-%m-%d #[fg=#9ccfd8]%H:%M "

setw -g window-status-current-format "#[bg=#2a273f,fg=#9ccfd8,bold] #I:#W #[bg=#232136,fg=#2a273f]"
setw -g window-status-format "#[fg=#6e6a86] #I:#W "

set -g pane-border-style "fg=#2a273f"
set -g pane-active-border-style "fg=#c4a7e7"

set -g message-style "bg=#f6c177,fg=#232136,bold"
set -g mode-style "bg=#c4a7e7,fg=#232136"
